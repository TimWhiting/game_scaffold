name: game_scaffold
description: Flutter support for a turn based game framework.
version: 0.5.0-dev
homepage: https://github.com/TimWhiting/game_scaffold

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  collection: ^1.18.0
  firebase_dart: ^1.1.4
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  flutter_riverpod: ^2.5.1
  game_scaffold_dart: ^0.4.1
  hooks_riverpod: ^2.5.1
  logging: ^1.2.0
  riverpod: ^2.5.1

dev_dependencies:
  dartdoc: ^8.0.13
  flutter_test:
    sdk: flutter
  game_scaffold_games: ^0.5.0-dev

dependency_overrides:
  game_scaffold_dart:
    path: ../dart
  game_scaffold_games:
    path: ../games
  riverpod_analyzer_utils:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_analyzer_utils #^3.0.0-dev.11
      ref: dev
  riverpod:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod #^3.0.0-dev.11
      ref: dev
  flutter_riverpod:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/flutter_riverpod #^3.0.0-dev.11
      ref: dev
  hooks_riverpod:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/hooks_riverpod #^3.0.0-dev.11
      ref: dev
  riverpod_annotation:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_annotation #^3.0.0-dev.11
      ref: dev
  riverpod_generator:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_generator #^3.0.0-dev.11
      ref: dev

flutter: null
