name: game_scaffold_test
description: Testing support for game_scaffold.
version: 0.5.0-dev
homepage: https://www.github.com/TimWhiting/game_scaffold

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  game_scaffold_dart: ^0.5.0-dev
  meta: ^1.15.0
  test: ^1.25.8
  riverpod: ^3.0.0-dev

dev_dependencies:
  game_scaffold_games: ^0.5.0-dev


dependency_overrides:
  game_scaffold_dart:
    path: ../dart
  game_scaffold_games:
    path: ../games
  riverpod_analyzer_utils:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_analyzer_utils #^3.0.0-dev.11
      ref: dev
  riverpod:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod #^3.0.0-dev.11
      ref: dev
  riverpod_annotation:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_annotation #^3.0.0-dev.11
      ref: dev
  riverpod_generator:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_generator #^3.0.0-dev.11
      ref: dev
