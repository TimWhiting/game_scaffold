name: game_scaffold_dart
description: A scaffold for game projects, taking care of server implementation
  and some general events
version: 0.5.0-dev.1
homepage: https://github.com/TimWhiting/game_scaffold

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  characters: 1.4.0
  collection: 1.19.1
  enum_to_string: 2.2.1
  fast_immutable_collections: 11.1.0
  freezed_annotation: 3.1.0
  json_annotation: 4.9.0
  logging: 1.3.0
  riverpod: 3.0.3
  riverpod_annotation: 3.0.3

dev_dependencies:
  build_runner: 2.10.4
  freezed: 3.2.3
  json_serializable: 6.11.2
  riverpod_generator: 3.0.3
  test: 1.28.0

scripts:
  - gen: dart run build_runner build