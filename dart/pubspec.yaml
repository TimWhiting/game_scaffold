name: game_scaffold_dart
description: A scaffold for game projects, taking care of server implementation
  and some general events
version: 0.5.0-dev.1
homepage: https://github.com/TimWhiting/game_scaffold

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  characters: ^1.3.0
  collection: ^1.18.0
  enum_to_string: ^2.0.1
  fast_immutable_collections: ^10.2.4
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logging: ^1.2.0
  riverpod: ^3.0.0-dev.3
  riverpod_annotation: ^3.0.0-dev.3

dev_dependencies:
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.2
  test: ^1.25.8

scripts:
  - gen: dart run build_runner build

dependency_overrides:
  
  riverpod_analyzer_utils:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_analyzer_utils #^3.0.0-dev.11
      ref: dev
  riverpod:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod #^3.0.0-dev.11
      ref: dev
  riverpod_annotation:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_annotation #^3.0.0-dev.11
      ref: dev
  riverpod_generator:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_generator #^3.0.0-dev.11
      ref: dev
