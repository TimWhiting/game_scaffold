name: game_scaffold_dart
description: A scaffold for game projects, taking care of server implementation
  and some general events
version: 0.5.0-dev.1
homepage: https://github.com/TimWhiting/game_scaffold

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  characters: ^1.3.0
  collection: ^1.19.0
  enum_to_string: ^2.0.1
  fast_immutable_collections: ^11.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logging: ^1.3.0
  riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  test: ^1.25.8

scripts:
  - gen: dart run build_runner build