name: game_scaffold_dart
description: A scaffold for game projects, taking care of server implementation
  and some general events
version: 0.5.0-dev.1
homepage: https://github.com/TimWhiting/game_scaffold

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  characters: ^1.4.1
  collection: ^1.19.1
  enum_to_string: ^2.2.1
  fast_immutable_collections: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  test: ^1.25.8

scripts:
  - gen: dart run build_runner build