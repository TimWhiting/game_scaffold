name: game_scaffold_games
description: Games for the game_scaffold_dart package
version: 0.5.0-dev
homepage: https://github.com/TimWhiting/game_scaffold

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  collection: ^1.18.0
  fast_immutable_collections: ^10.1.1
  freezed_annotation: ^2.4.1
  game_scaffold_dart: ^0.5.0-dev
  json_annotation: ^4.8.1

dev_dependencies:
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1


dependency_overrides:
  game_scaffold_dart:
    path: ../dart
  riverpod_analyzer_utils:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_analyzer_utils #^3.0.0-dev.11
      ref: dev
  riverpod:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod #^3.0.0-dev.11
      ref: dev
  riverpod_annotation:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_annotation #^3.0.0-dev.11
      ref: dev
  riverpod_generator:
    git:
      url: https://github.com/rrousselgit/riverpod
      path: packages/riverpod_generator #^3.0.0-dev.11
      ref: dev
